[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avv-checker"
version = "1.0.0"
description = "Wortlautbasierte Prüfung eines Auftragsverarbeitungsvertrags (AVV) auf die Pflichtinhalte nach Art. 28 Abs. 2 bis 4 DSGVO."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Milaim Delija" }]
keywords = ["dsgvo", "gdpr", "avv", "auftragsverarbeitung", "datenschutz", "compliance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "python-docx>=1.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[project.scripts]
avv-checker = "avv_checker.cli:main"

[project.urls]
Repository = "https://github.com/milaimdelija/avv-checker"

[tool.hatch.build.targets.wheel]
packages = ["src/avv_checker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
